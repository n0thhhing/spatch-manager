name: nightly

on:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build Manager APK
        env:
          MANAGER_KEYSTORE: ${{ secrets.MANAGER_KEYSTORE }}
          MANAGER_KS_PASS: ${{ secrets.MANAGER_KS_PASS }}
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null
          fi
          if ! ls "$ANDROID_HOME"/platforms/android-*/android.jar >/dev/null 2>&1; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" > /dev/null
          fi
          mkdir -p out
          ver="$(cat VERSION)-${GITHUB_SHA::7}"
          if [ -n "${MANAGER_KEYSTORE:-}" ] && [ -n "${MANAGER_KS_PASS:-}" ]; then
            printf '%s' "$MANAGER_KEYSTORE" | base64 -d > "$RUNNER_TEMP/manager.p12"
            ./build.sh "$ver" out/spatch-manager.apk --keystore "$RUNNER_TEMP/manager.p12" --alias "${MANAGER_KS_ALIAS:-spatch-test}" --ks-pass-env MANAGER_KS_PASS
          else
            echo "MANAGER_KEYSTORE / MANAGER_KS_PASS secrets not set; skipping signed APK publish"
            ./build.sh "$ver" out/spatch-manager.apk
          fi
      - name: Publish nightly release
        if: env.MANAGER_KEYSTORE != '' || secrets.MANAGER_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly out/spatch-manager.apk --clobber
          else
            gh release create nightly out/spatch-manager.apk --prerelease --title "Nightly" --notes "Automated nightly build of Spatch Manager (${GITHUB_SHA::7})."
          fi
